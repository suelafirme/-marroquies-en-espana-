async function api(path,{method='GET',body,auth=true,prefer='',headers={}}={}){
 if(!isLive)throw Error('ماشي فالوضع المباشر');
 if(auth && session?.refresh_token && session?.expires_at && Math.floor(Date.now()/1000)>session.expires_at-90)await refresh();
 const h={apikey:CONFIG.publishableKey,...headers};if(auth && session?.access_token)h.Authorization='Bearer '+session.access_token;
 if(prefer)h.Prefer=prefer;
 let payload;
 if(body!==undefined){if(body instanceof Blob || body instanceof ArrayBuffer){payload=body}else{h['Content-Type']='application/json';payload=JSON.stringify(body)}}
 const r=await fetch(CONFIG.supabaseUrl.replace(/\/$/,'')+path,{method,headers:h,body:payload});
 const type=r.headers.get('content-type')||'';const data=type.includes('json')?await r.json():await r.text();
 if(!r.ok)throw Error(typeof data==='object'?(data.message||data.error_description||data.msg||data.error||r.statusText):data||r.statusText);
 return data;
}
async function refresh(){if(!session?.refresh_token)throw Error('الجلسة سالات');let r=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token},auth:false});session=r;write(K_SESSION,session);return r}

async function loadData(){if(!isLive){state.data=demo;state.profile=demo.profile;state.loaded=true;render();return}

 try{
 const spec=[['profiles','/rest/v1/profiles?select=id,display_name,city,bio&limit=200'],['posts','/rest/v1/posts?select=*&order=created_at.desc&limit=100'],['comments','/rest/v1/comments?select=*&order=created_at.desc&limit=600'],['likes','/rest/v1/likes?select=post_id,user_id&limit=1800'],['listings','/rest/v1/listings?select=*&order=created_at.desc&limit=100'],['friend_requests','/rest/v1/friend_requests?select=*&limit=350'],['messages','/rest/v1/messages?select=*&order=created_at.desc&limit=250'],['notifications','/rest/v1/notifications?select=*&order=created_at.desc&limit=100'],['saved_listings','/rest/v1/saved_listings?select=user_id,listing_id&limit=400'],['blocks','/rest/v1/blocks?select=*&limit=200'],['communities','/rest/v1/communities?select=*&order=created_at.asc&limit=100'],['community_members','/rest/v1/community_members?select=community_id,user_id&limit=200']];
 const parts=await Promise.all(spec.map(async ([k,path])=>[k,rows(await api(path))]));state.data=Object.fromEntries(parts);
 if(state.profile&&!state.data.profiles.some(p=>p.id===myself()))state.data.profiles.push(state.profile);
 state.notice='';
 }catch(e){state.notice=niceError(e);toast(state.notice)}finally{state.loaded=true;state.loading=false;render()}
}
async function uploadImage(file){if(!file)return null;if(file.size>3*1024*1024)throw Error('الصورة خاصها تكون أقل من 3MB.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('استعمل JPG أو PNG أو WEBP');
 if(!isLive)return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(Error('ما تقراتش الصورة'));r.readAsDataURL(file)});
 const ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[file.type];const key=myself()+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
 await api('/storage/v1/object/mee-posts/'+key,{method:'POST',body:file,headers:{'Content-Type':file.type}});return key;
}

 if(!isLive)throw Error('Internal: demo mutation must use local state');

}

function postCard(p){const likes=rows(state.data.likes).filter(x=>x.post_id===p.id);const count=rows(state.data.comments).filter(x=>x.post_id===p.id).length;const liked=likes.some(x=>x.user_id===myself());const own=p.user_id===myself();const joinedGroup=rows(state.data.communities).find(g=>g.id===p.community_id);const photo=imageUrl(p.image_path);return `<article class="card post" data-post="${esc(p.id)}"><div class="post-head">${avatar(p.user_id)}<div class="who"><span class="name">${nameById(p.user_id)}</span><span class="meta">📍 ${esc(p.city)} · ${esc(ago(p.created_at))}${joinedGroup?' · '+esc(joinedGroup.title):''}</span></div>${own?button('حذف','deletePost',`data-id="${esc(p.id)}"`,'ghost tiny'):button('⚑','report',`data-type="post" data-id="${esc(p.id)}"`,'ghost tiny')}</div><div class="post-copy">${esc(p.body)}</div>${photo?`<img class="post-image" src="${esc(photo)}" alt="صورة المنشور" loading="lazy">`:''}<div class="post-stats"><span>❤️ ${likes.length} إعجاب</span><span>💬 ${count} تعليق</span></div><div class="post-actions"><button data-action="like" data-id="${esc(p.id)}" class="${liked?'active':''}">${liked?'❤️':'♡'} إعجاب</button><button data-action="toggleComments" data-id="${esc(p.id)}">💬 تعليق</button><button data-action="share" data-id="${esc(p.id)}">↗ مشاركة</button></div>${state.commentsOpen===p.id?renderComments(p.id):''}</article>`}
function renderComments(postId){const list=rows(state.data.comments).filter(c=>c.post_id===postId).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));return `<div style="border-top:1px solid var(--line);padding-top:11px">${list.map(c=>`<div class="comment"><b>${nameById(c.user_id)}</b>${esc(c.body)}</div>`).join('')||'<div class="small muted">كون أول واحد يعلق</div>'}<form class="inline-form" data-form="comment" data-post="${esc(postId)}"><input name="body" minlength="1" maxlength="700" required placeholder="كتب تعليق بالدارجة…"><button class="btn primary tiny">نشر</button></form></div>`}
function friendControls(personId){if(personId===myself())return'';const f=friendship(personId);if(!f)return button('＋ زيد صديق','sendInvite',`data-id="${esc(personId)}"`,'primary tiny');if(f.status==='accepted')return button('✉ رسالة','openChat',`data-id="${esc(personId)}"`,'outline tiny');if(f.status==='declined')return `<span class="tag">تم رفض الطلب</span>`;if(f.requester_id===myself())return button('⏳ طلب مرسل','cancelInvite',`data-id="${esc(f.id)}"`,'ghost tiny');return `<div class="button-row">${button('✓ قبول','acceptInvite',`data-id="${esc(f.id)}"`,'primary tiny')}${button('رفض','declineInvite',`data-id="${esc(f.id)}"`,'ghost tiny')}</div>`}
function peoplePage(){const q=state.search.trim().toLowerCase();const people=allPeople().filter(p=>(state.city==='all'||p.city===state.city)&&(!q||`${p.display_name} ${p.city} ${p.bio||''}`.toLowerCase().includes(q)));const incoming=rows(state.data.friend_requests).filter(f=>f.addressee_id===myself()&&f.status==='pending');const mine=state.peopleFilter==='friends'?people.filter(p=>acceptedFriends().includes(p.id)):state.peopleFilter==='requests'?people.filter(p=>incoming.some(f=>f.requester_id===p.id)):people;return `${sectionTitle('الناس والأصدقاء',`${people.length} حسابات يمكن تتواصل معاها`,button('دعوة لصحابك','inviteApp','', 'primary tiny'))}<div class="tabs-bar"><button class="${state.peopleFilter==='all'?'active':''}" data-action="peopleFilter" data-value="all">الناس كاملين</button><button class="${state.peopleFilter==='friends'?'active':''}" data-action="peopleFilter" data-value="friends">صحابي (${acceptedFriends().length})</button><button class="${state.peopleFilter==='requests'?'active':''}" data-action="peopleFilter" data-value="requests">طلبات (${incoming.length})</button></div><div class="toolbar">${cityChooser()}<input class="input" id="main-search" placeholder="قلب على شي شخص…" value="${esc(state.search)}"></div>${mine.map(p=>`<div class="card member-card">${avatar(p.id)}<div class="member-info"><b>${esc(p.display_name)}</b><p>📍 ${esc(p.city)} · ${esc(p.bio||'عضو فالجالية')}</p></div><div class="button-row">${friendControls(p.id)}${button('⋯','personMenu',`data-id="${esc(p.id)}"`,'ghost tiny')}</div></div>`).join('')||noData('👥','ما لقيتش ناس بهاد البحث','بدل المدينة أو جرّب اسم آخر.')}`}
function messagesPage(){const ids=acceptedFriends();if(!ids.length)return `${sectionTitle('الرسائل الخاصة','التواصل كيكون غير مع الأصدقاء المقبولين')}${noData('💬','ما عندكش محادثات دابا','سير لقسم الناس، صيفط طلب صداقة، وملي يتقبل تقدر تهضر فالدردشة.',button('لقى صحابك','nav','data-tab="people"','primary'))}`;
 const active=ids.includes(state.activeChat)?state.activeChat:ids[0];state.activeChat=active;const messages=rows(state.data.messages).filter(m=>(m.sender_id===myself()&&m.recipient_id===active)||(m.recipient_id===myself()&&m.sender_id===active)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));return `${sectionTitle('الرسائل الخاصة','مراسلة بين الأصدقاء المقبولين',button('↻ تحديث','reload'))}<div class="conversation-grid"><div class="contact-list">${ids.map(id=>`<button data-action="openChat" data-id="${esc(id)}" class="contact ${active===id?'selected':''}">${avatar(id)}<b>${nameById(id)}</b></button>`).join('')}</div><div class="chat-box"><div class="chat-head">${avatar(active)}<b>${nameById(active)}</b><span class="tag green">صديق</span></div><div class="chat-scroll" id="chat-scroll">${messages.length?messages.map(m=>`<div class="bubble ${m.sender_id===myself()?'mine':''}">${esc(m.body)}<time>${esc(time(m.created_at))}</time></div>`).join(''):'<div class="empty">سلّم على صاحبك وبدا المحادثة 👋</div>'}</div><form data-form="message" data-to="${esc(active)}" class="chat-compose"><input class="input" name="body" maxlength="2000" required placeholder="كتب رسالة خاصة…"><button class="btn primary">إرسال</button></form></div></div><div class="hint-box">🔒 غير نتا وصاحبك اللي يقدرو يشوفو محادثتكم؛ تقدر تحظر أي عضو وتبلغ عليه. التحديث تلقائي كل 20 ثانية فهاد النسخة.</div>`}

 else list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
 const title={market:'السوق المغربي',jobs:'فرص الخدمة',rentals:'الكراء والسكن',saved:'الإعلانات المحفوظة'}[section];

 if(section==='market')return `<div class="market-intro"><span class="overline">🇲🇦 MARROQUÍES EN ESPAÑA</span><h2>السوق ديال الجالية</h2><p>بيع، شري، وقلب على اللي محتاج فمدينتك ولا فإسبانيا كاملة.</p><div class="market-tools"><span>✦ إعلانات الناس · ثقة وتواصل</span>${button('＋ بيع شي حاجة','compose','data-kind="sale"','primary tiny')}</div></div>
 <div class="market-cat-scroll" aria-label="تصنيفات السوق">${MARKET_CATS.map(([v,label,emoji])=>`<button class="market-category ${state.marketCategory===v?'active':''}" data-action="marketCategory" data-value="${v}" type="button"><span class="emoji">${emoji}</span>${label}</button>`).join('')}</div>

async function createPost(form){const text=form.elements.body.value.trim();if(text.length<3)throw Error('المنشور خاصو يكون على الأقل 3 حروف');const community=form.elements.community.value||null;const file=form.elements.file.files[0];const obj={user_id:myself(),body:text,city:form.elements.city.value.trim(),community_id:community,image_path:await uploadImage(file)};
 if(isLive)await mutate({table:'posts',value:obj});else demo.posts.unshift({...obj,id:uid(),created_at:new Date().toISOString()});state.modal=null;state.tab=community?'groupFeed':'feed';state.activeCommunity=community;isLive?await loadData():afterDemoChange()}
async function createListing(form){const title=form.elements.title.value.trim(),body=form.elements.body.value.trim(),amount=form.elements.price.value;const kind=form.elements.kind.value;if(title.length<3||body.length<3)throw Error('كمل عنوان ووصف الإعلان');if(!['sale','service','job','rental'].includes(kind))throw Error('نوع الإعلان غير صحيح');const obj={user_id:myself(),title,body,kind,category:form.elements.category.value,city:form.elements.city.value.trim(),price_eur:amount===''?null:Number(amount),image_path:await uploadImage(form.elements.file.files[0])};
 if(isLive)await mutate({table:'listings',value:obj});else demo.listings.unshift({...obj,id:uid(),created_at:new Date().toISOString()});state.modal=null;state.city='all';state.search='';state.minPrice='';state.maxPrice='';state.tab=kind==='job'?'jobs':kind==='rental'?'rentals':'market';isLive?await loadData():afterDemoChange()}
async function saveProfile(form){const obj={display_name:form.elements.name.value.trim(),city:form.elements.city.value.trim(),bio:form.elements.bio.value.trim()};if(obj.display_name.length<2)throw Error('الإسم قصير');if(isLive){await mutate({table:'profiles',op:'update',value:obj,where:'?id=eq.'+encodeURIComponent(myself())});state.profile={...state.profile,...obj};await loadData()}else{demo.profile={...demo.profile,...obj};demo.profiles=demo.profiles.map(p=>p.id===myself()?{...p,...obj}:p);afterDemoChange()}state.modal=null;state.tab='profile'}
async function likePost(id){const liked=state.data.likes.find(x=>x.post_id===id&&x.user_id===myself());if(isLive){if(liked)await mutate({table:'likes',op:'delete',where:'?post_id=eq.'+encodeURIComponent(id)+'&user_id=eq.'+encodeURIComponent(myself())});else await mutate({table:'likes',value:{post_id:id,user_id:myself()}});await loadData()}else{if(liked)demo.likes=demo.likes.filter(x=>x!==liked);else{demo.likes.push({post_id:id,user_id:myself()});const p=demo.posts.find(p=>p.id===id);if(p&&p.user_id!==myself())demo.notifications.unshift({id:uid(),actor_id:myself(),recipient_id:p.user_id,kind:'like',ref_id:id,is_read:false,created_at:new Date().toISOString()})}afterDemoChange()}}
async function sendComment(form){const postId=form.dataset.post,text=form.elements.body.value.trim();if(!text)return;const obj={post_id:postId,user_id:myself(),body:text};if(isLive){await mutate({table:'comments',value:obj});await loadData()}else{demo.comments.push({...obj,id:uid(),created_at:new Date().toISOString()});afterDemoChange()}}
async function deletePost(id){if(!window.confirm('متأكد بغيتي تحذف المنشور؟'))return;if(isLive){await mutate({table:'posts',op:'delete',where:'?id=eq.'+encodeURIComponent(id)});await loadData()}else{demo.posts=demo.posts.filter(x=>x.id!==id);demo.comments=demo.comments.filter(x=>x.post_id!==id);demo.likes=demo.likes.filter(x=>x.post_id!==id);afterDemoChange()}}
async function deleteListing(id){if(!window.confirm('متأكد بغيتي تحذف الإعلان؟'))return;if(isLive){await mutate({table:'listings',op:'delete',where:'?id=eq.'+encodeURIComponent(id)});await loadData()}else{demo.listings=demo.listings.filter(x=>x.id!==id);demo.saved_listings=demo.saved_listings.filter(x=>x.listing_id!==id);afterDemoChange()}state.modal=null}
async function saveListing(id){const exists=state.data.saved_listings.some(x=>x.listing_id===id&&x.user_id===myself());if(isLive){if(exists)await mutate({table:'saved_listings',op:'delete',where:'?user_id=eq.'+encodeURIComponent(myself())+'&listing_id=eq.'+encodeURIComponent(id)});else await mutate({table:'saved_listings',value:{user_id:myself(),listing_id:id}});await loadData()}else{if(exists)demo.saved_listings=demo.saved_listings.filter(x=>!(x.user_id===myself()&&x.listing_id===id));else demo.saved_listings.push({user_id:myself(),listing_id:id});afterDemoChange()}}
async function sendInvite(to){if(friendship(to))throw Error('طلب الصداقة ديالكم راه موجود');if(isBlocked(to))throw Error('هاد العضو محظور');const obj={requester_id:myself(),addressee_id:to,status:'pending'};if(isLive){await mutate({table:'friend_requests',value:obj});await loadData()}else{demo.friend_requests.push({...obj,id:uid(),created_at:new Date().toISOString()});afterDemoChange()}}
async function updateInvite(id,status){const obj=state.data.friend_requests.find(x=>x.id===id);if(!obj||obj.addressee_id!==myself()||obj.status!=='pending')throw Error('هاد الطلب ماشي متاح');if(isLive){await mutate({table:'friend_requests',op:'update',value:{status},where:'?id=eq.'+encodeURIComponent(id)});await loadData()}else{obj.status=status;afterDemoChange()}}
async function cancelInvite(id){const req=state.data.friend_requests.find(x=>x.id===id);if(!req||req.requester_id!==myself())throw Error('ماشي الطلب ديالك');if(isLive){await mutate({table:'friend_requests',op:'delete',where:'?id=eq.'+encodeURIComponent(id)});await loadData()}else{demo.friend_requests=demo.friend_requests.filter(x=>x.id!==id);afterDemoChange()}}
async function sendMessage(form){const to=form.dataset.to,body=form.elements.body.value.trim();if(!body)return;if(!acceptedFriends().includes(to))throw Error('خاص الصداقة تكون مقبولة قبل الرسائل');const obj={sender_id:myself(),recipient_id:to,body};if(isLive){await mutate({table:'messages',value:obj});await loadData()}else{demo.messages.push({...obj,id:uid(),created_at:new Date().toISOString()});afterDemoChange()}state.activeChat=to;state.tab='messages'}
async function toggleGroup(id){const joined=state.data.community_members.some(x=>x.community_id===id&&x.user_id===myself());if(isLive){if(joined)await mutate({table:'community_members',op:'delete',where:'?community_id=eq.'+encodeURIComponent(id)+'&user_id=eq.'+encodeURIComponent(myself())});else await mutate({table:'community_members',value:{community_id:id,user_id:myself()}});await loadData()}else{if(joined)demo.community_members=demo.community_members.filter(x=>!(x.community_id===id&&x.user_id===myself()));else demo.community_members.push({community_id:id,user_id:myself()});afterDemoChange()}}
async function reportUser(form){const obj={reporter_id:myself(),target_type:form.dataset.type,target_id:form.dataset.id,reason:form.elements.reason.value.trim()};if(obj.reason.length<8)throw Error('كتب سبب واضح للتبليغ');if(isLive)await mutate({table:'reports',value:obj});else{demo.reports=demo.reports||[];demo.reports.push({...obj,id:uid(),created_at:new Date().toISOString()});saveDemo()}state.modal=null;toast('تسجل التبليغ. شكراً على المساعدة.')}
async function toggleBlock(id){const blocked=isBlocked(id);if(isLive){if(blocked)await mutate({table:'blocks',op:'delete',where:'?blocker_id=eq.'+encodeURIComponent(myself())+'&blocked_id=eq.'+encodeURIComponent(id)});else await mutate({table:'blocks',value:{blocker_id:myself(),blocked_id:id}});await loadData()}else{if(blocked)demo.blocks=demo.blocks.filter(x=>x.blocked_id!==id);else demo.blocks.push({blocker_id:myself(),blocked_id:id});afterDemoChange()}state.modal=null;state.activeChat=null}
async function readNotice(id){if(isLive){await mutate({table:'notifications',op:'update',value:{is_read:true},where:'?id=eq.'+encodeURIComponent(id)});await loadData()}else{let n=demo.notifications.find(x=>x.id===id);if(n)n.is_read=true;afterDemoChange()}}
async function readAll(){if(isLive){await mutate({table:'notifications',op:'update',value:{is_read:true},where:'?recipient_id=eq.'+encodeURIComponent(myself())+'&is_read=eq.false'});await loadData()}else{demo.notifications.filter(x=>x.recipient_id===myself()).forEach(x=>x.is_read=true);afterDemoChange()}}
function navigate(tab){state.tab=tab;state.commentsOpen=null;state.modal=null;state.search='';state.minPrice='';state.maxPrice='';window.scrollTo({top:0,behavior:'instant'});render()}
async function installApp(){if(state.installPrompt){const prompt=state.installPrompt;state.installPrompt=null;await prompt.prompt();await prompt.userChoice;return}toast('فـChrome: افتح القائمة ⋮ واختار «إضافة للشاشة الرئيسية» أو «تثبيت التطبيق».')}
function shareApp(){const url=location.protocol.startsWith('http')?location.href.split('?')[0]:'رابط التطبيق ملي يتنشر';copyText('🇲🇦🇪🇸 Marroquíes en España — مجتمع المغاربة فإسبانيا. '+url)}

document.addEventListener('click',event=>{
 const el=event.target.closest('[data-action]');if(!el){if(event.target.dataset?.backdrop){state.modal=null;render()}return}
 const action=el.dataset.action,id=el.dataset.id;
 if(action==='closeModal'){state.modal=null;render();return}
 if(action==='nav'){navigate(el.dataset.tab||'feed');return}
 if(action==='setAuthMode'){state.authMode=el.dataset.mode||'login';render();return}
 if(action==='compose'){state.modal={type:el.dataset.kind==='post'?'post':'listing',kind:el.dataset.kind||'post',group:el.dataset.group||null};render();return}
 if(action==='editProfile'){state.modal={type:'profile'};render();return}
 if(action==='personMenu'){state.modal={type:'personMenu',id};render();return}
 if(action==='listingDetail'){state.modal={type:'listingDetail',id};render();return}
 if(action==='report'){state.modal={type:'report',targetType:el.dataset.type,id};render();return}
 if(action==='toggleComments'){state.commentsOpen=state.commentsOpen===id?null:id;render();return}
 if(action==='openGroup'){state.activeCommunity=id;navigate('groupFeed');return}
 if(action==='openChat'){state.activeChat=id;state.modal=null;navigate('messages');return}
 if(action==='peopleFilter'){state.peopleFilter=el.dataset.value;render();return}
 if(action==='kindFilter'){state.kind=el.dataset.value;render();return}
 if(action==='marketCategory'){state.marketCategory=el.dataset.value||'all';render();return}
 if(action==='reload'){run(loadData,'تحدّثت البيانات ✅');return}
 if(action==='inviteApp'){shareApp();return}
 if(action==='share'){shareApp();return}
 if(action==='install'){installApp();return}
 if(action==='resetFilters'){state.minPrice='';state.maxPrice='';state.city='all';state.search='';state.marketCategory='all';state.marketSort='new';state.kind='all';render();return}
 if(action==='resetDemo'){if(window.confirm('تمسح التغييرات التجريبية وترجع البيانات الأولى؟')){demo=demoSeed();saveDemo();navigate('feed')}return}
 if(action==='logout'){run(logout);return}
 if(action==='like'){run(()=>likePost(id));return}
 if(action==='deletePost'){run(()=>deletePost(id));return}
 if(action==='deleteListing'){run(()=>deleteListing(id));return}
 if(action==='saveListing'){run(()=>saveListing(id));return}
 if(action==='sendInvite'){run(()=>sendInvite(id),'تصيفط طلب الصداقة ✅');return}
 if(action==='acceptInvite'){run(()=>updateInvite(id,'accepted'),'تقبل الطلب ✅');return}
 if(action==='declineInvite'){run(()=>updateInvite(id,'declined'),'ترفض الطلب');return}
 if(action==='cancelInvite'){run(()=>cancelInvite(id),'تلغى الطلب');return}
 if(action==='toggleGroup'){run(()=>toggleGroup(id));return}
 if(action==='readNotice'){run(()=>readNotice(id));return}
 if(action==='readAllNotices'){run(readAll);return}
 if(action==='toggleBlock'||action==='unblock'){run(()=>toggleBlock(id));return}
});
document.addEventListener('submit',event=>{
 const form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();const action=form.dataset.form;
 if(action==='auth'){
  const email=form.elements.email.value.trim(),password=form.elements.password.value;
  if(state.authMode==='signup'){
   const name=form.elements.name.value.trim(),city=form.elements.city.value;
   run(async()=>{const data=await signup(name,city,email,password);if(data?.access_token){await loadData();toast('مرحبا بيك! تسجل الحساب ✅')}else{state.authMode='login';toast('تصيفط إيميل التأكيد. أكد الإيميل ومن بعد دخل للحساب.')}});
  }else run(async()=>{await login(email,password);toast('مرحبا بيك! ✅')});
  return;
 }
 if(!signedIn()){toast('خاصك تدخل للحساب قبل هاد العملية');return}
 if(action==='post'){run(()=>createPost(form),'تنشر المنشور ✅');return}
 if(action==='listing'){run(()=>createListing(form),'تنشر الإعلان ✅');return}
 if(action==='profile'){run(()=>saveProfile(form),'تحفظ البروفايل ✅');return}
 if(action==='comment'){run(()=>sendComment(form));return}
 if(action==='message'){run(()=>sendMessage(form));return}
 if(action==='report'){run(()=>reportUser(form));return}
});
document.addEventListener('change',event=>{
 const t=event.target;
 if(t.id==='global-city'){state.city=t.value.trim()||'all';render();return}
 if(t.id==='price-min'){state.minPrice=t.value;render();return}
 if(t.id==='price-max'){state.maxPrice=t.value;render();return}
 if(t.id==='market-sort'){state.marketSort=t.value;render();return}
 if(t.matches('input[type=file]')){const file=t.files?.[0],img=document.getElementById('preview-image');if(img){if(file){const u=URL.createObjectURL(file);img.src=u;img.style.display='block';img.onload=()=>URL.revokeObjectURL(u)}else{img.src='';img.style.display='none'}}}
});
let searchDelay=0;
document.addEventListener('input',event=>{
 if(event.target.id==='global-city'){const input=event.target;const val=input.value;const pos=input.selectionStart;state.city=val.trim()||'all';clearTimeout(searchDelay);searchDelay=setTimeout(()=>{render();const next=document.getElementById('global-city');if(next){next.focus();try{next.setSelectionRange(pos,pos)}catch{}}},450);return;}
 if(event.target.id==='header-query'||event.target.id==='main-search'){
  const input=event.target;const val=input.value;const pos=input.selectionStart;state.search=val;clearTimeout(searchDelay);
  searchDelay=setTimeout(()=>{render();const next=document.getElementById(input.id);if(next){next.focus();try{next.setSelectionRange(pos,pos)}catch{}}},350);
 }
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.modal){state.modal=null;render()}if((event.key==='Enter'||event.key===' ')&&event.target.matches('article[data-action=listingDetail]')){event.preventDefault();state.modal={type:'listingDetail',id:event.target.dataset.id};render()}});
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();state.installPrompt=event});
window.addEventListener('online',()=>toast('رجع الإنترنت ✅'));
window.addEventListener('offline',()=>toast('ما كاينش الإنترنت؛ وضع التجربة كيخدم محلياً.'));
async function boot(){if(!isLive){state.loaded=true;state.profile=demo.profile;render()}else{
  if(session?.access_token){try{await ensureProfile();await loadData()}catch(e){session=null;write(K_SESSION,null);state.loaded=true;toast(niceError(e));render()}}else{state.loaded=true;render()}}
  if('serviceWorker' in navigator&&['http:','https:'].includes(location.protocol))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  setInterval(()=>{if(isLive&&session?.access_token&&!state.loading&&document.visibilityState==='visible'&&['messages','notifications','people'].includes(state.tab))loadData().catch(()=>{})},20000);
}
boot().catch(e=>{toast(niceError(e));state.loaded=true;render()});
})();
</script>
</body>
