name: Build Android debug APK
on:
  push:
    branches: [main]
    paths:
      - index.html
      - package.json
      - capacitor.config.json
      - scripts/**
      - .github/workflows/android-debug.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Check web source
        run: |
          test -s index.html
          test -s capacitor.config.json
          grep -q 'Marroquíes en España' index.html
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: |
          npm run build
          npx cap add android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Marroquies-en-Espana-Premium-V6-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
