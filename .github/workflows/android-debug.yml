name: Build Android debug APK
on:
  push:
    branches: [main]
    paths:
      - index.html
      - package.json
      - capacitor.config.json
      - scripts/**
      - .github/workflows/android-debug.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Check web source
        run: |
          test -s index.html
          test -s capacitor.config.json
          grep -q 'Marroquíes en España' index.html
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: |
          npm run build
          npx cap add android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Marroquies-en-Espana-Premium-V6-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare direct APK file
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Marroquies_en_Espana_Beta.apk
          sha256sum Marroquies_en_Espana_Beta.apk > Marroquies_en_Espana_Beta.apk.sha256

      - name: Publish public APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="beta-v6-direct"
          FILE="Marroquies_en_Espana_Beta.apk"
          HASH="Marroquies_en_Espana_Beta.apk.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" "$HASH" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" "$HASH" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Marroquíes en España — Android Beta V6" \
              --notes "Android beta for testing. This is a debug APK (not a production release). Install at your own risk; test account flows before entering personal data.\n\nDirect APK download is in the Assets section." \
              --prerelease
          fi
